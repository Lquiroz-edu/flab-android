name: Release

# Publishes a signed APK as a GitHub Release.
#
# The point of this workflow is not convenience. Installers that use Android's session-based
# PackageInstaller API — an app store, or Obtainium pointed at this repo — are exempt from the
# Restricted Settings block that otherwise prevents a sideloaded F/LAB from enabling its
# accessibility service. Publishing releases is what makes that route available.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build-sign-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Written outside the workspace so it cannot be picked up by a build scan, an artifact
      # upload, or a stray `git add -A`.
      - name: Materialise signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FLAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No FLAB_KEYSTORE_BASE64 secret. Falling back to the debug key — the APK will install, but a later release signed with a different key will require an uninstall first. See README."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flab-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build release APK
        env:
          FLAB_KEYSTORE_PATH: ${{ steps.signing.outputs.configured == 'true' && format('{0}/flab-release.jks', runner.temp) || '' }}
          FLAB_KEYSTORE_PASSWORD: ${{ secrets.FLAB_KEYSTORE_PASSWORD }}
          FLAB_KEY_ALIAS: ${{ secrets.FLAB_KEY_ALIAS }}
          FLAB_KEY_PASSWORD: ${{ secrets.FLAB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Confirm the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "No APK at $APK"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "flab-${GITHUB_REF_NAME:-manual}.apk"

      # Always removed, including when a step above failed.
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/flab-release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: flab-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
